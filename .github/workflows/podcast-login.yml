name: Temporary private Pi login
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: podcast-single-writer
  cancel-in-progress: false
jobs:
  login:
    if: github.repository_owner == 'yilinjushi' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-podcast-login.txt
      - run: npm ci --prefix podcast
      - run: npx --prefix podcast playwright install --with-deps chromium
      - name: Install temporary display and pinned tunnel
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/cloudflared" https://github.com/cloudflare/cloudflared/releases/download/2026.9.1/cloudflared-linux-amd64
          python -c "import hashlib,os,pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'cloudflared'; assert hashlib.sha256(p.read_bytes()).hexdigest()=='03f1f25d1cc93b9ad6c60569d44060bc4f17ed97075760ed8cfca4b12dcd68cc'"
          sudo install -m 755 "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared
      - name: User-operated login with encrypted state export
        env:
          PODCAST_LOGIN_KEY: ${{ secrets.PODCAST_LOGIN_KEY }}
          PODCAST_BUCKET: x-bookmarks-podcast
          PODCAST_S3_ENDPOINT: https://b1975f68b4b8c2551782f6d87dd7e64d.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.PODCAST_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PODCAST_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          PYTHONUTF8: '1'
        run: python podcast_login_host.py
# No screenshots, credentials, desktop URL, artifacts, or caches are published.
